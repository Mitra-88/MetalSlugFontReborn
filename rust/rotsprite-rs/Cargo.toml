[package]
name = "msfr_rotsprite"
version = "0.1.0"
edition = "2024"

[lib]
name = "msfr_rotsprite"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
rpath = false
