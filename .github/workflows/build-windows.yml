name: Build Windows

permissions:
  contents: read

on:
  push:
    branches:
      - Development
    paths:
      - '.github/workflows/**'
      - 'Assets/**'
      - 'Src/**'
      - 'rust/**'
      - 'versionfile.txt'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: '3.14.7'
          architecture: 'x64'
          cache: 'pip'

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create virtual environment
        run: py -m venv .venv

      - name: Activate virtual environment
        run: .venv\Scripts\activate

      - name: Install dependencies
        run: pip install --upgrade PySide6-Essentials pyinstaller pillow tomlkit

      - name: Write build commit
        shell: bash
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "Assets/Icons/Raubtier.ico" --name "MetalSlugFontReborn" --clean --optimize "2" --version-file "versionfile.txt" --add-data "Src/build_commit.txt;." --add-data "LICENSE;." --add-data "Assets;Assets/" --add-binary "rust/rotsprite-rs/target/release/msfr_rotsprite.dll;."  "Src/main.py"

      - name: Trim unused Qt components
        shell: bash
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* libcrypto-3-x64.dll libssl-3-x64.dll

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist/MetalSlugFontReborn
          compression-level: 9
