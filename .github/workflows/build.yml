name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - Development
      - Stable
    paths:
      - '.github/workflows/**'
      - 'Assets/**'
      - 'Src/**'
      - 'Tools/**'
      - 'rust/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'versionfile.txt'

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Install Python
        run: uv python install 3.15

      - name: Restore uv cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        shell: bash
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "Assets/Icons/Raubtier.ico" --name "MetalSlugFontReborn" --clean --optimize "2" --version-file "versionfile.txt" --add-data "Src/build_commit.txt;." --add-data "LICENSE;." --add-data "Assets;Assets/" --add-binary "rust/rotsprite-rs/target/release/msfr_rotsprite.dll;."  "Src/main.py"

      - name: Trim unused Qt components
        shell: bash
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* PySide6/Qt6OpenGL* PySide6/Qt6DBus* PySide6/Qt6Qml* PySide6/Qt6Quick* PySide6/Qt6Pdf* PySide6/Qt6Test* PySide6/Qt6Sql* PySide6/Qt6Help* PySide6/Qt6Designer* PySide6/Qt6UiTools* PySide6/Qt6Xml* PySide6/Qt6Concurrent* PySide6/Qt6PrintSupport* PySide6/Qt6WaylandClient* libcrypto-3-x64.dll libssl-3-x64.dll
          find PySide6/plugins/imageformats -type f ! -name "*qico*" -delete
          rm -f PIL/_avif*.pyd

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python
        run: uv python install 3.15

      - name: Restore uv cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Install xcb libraries for bundling
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 libxcb-shape0 libxcb-randr0 libxcb-xkb1

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --strip --name "MetalSlugFontReborn" --clean --optimize "2" --add-data "Src/build_commit.txt:." --add-data "LICENSE:." --add-data "Assets:Assets/" --add-binary "rust/rotsprite-rs/target/release/libmsfr_rotsprite.so:."  "Src/main.py"

      - name: Upload PyInstaller warnings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pyinstaller-warnings-linux
          path: build/MetalSlugFontReborn/warn-MetalSlugFontReborn.txt
          if-no-files-found: ignore

      - name: Trim unused Qt components
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines PySide6/plugins/egldeviceintegrations PySide6/plugins/wayland setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* PySide6/Qt6OpenGL* PySide6/Qt6WaylandClient* PySide6/libQt6Network* PySide6/libQt6Svg* libcrypto* libssl*
          rm -rf PySide6/Qt/translations PySide6/Qt/plugins/tls PySide6/Qt/plugins/networkinformation PySide6/Qt/plugins/generic PySide6/Qt/plugins/iconengines PySide6/Qt/plugins/egldeviceintegrations PySide6/Qt/plugins/wayland
          rm -f PySide6/Qt/lib/libQt6Network* PySide6/Qt/lib/libQt6Svg* PySide6/Qt/lib/libQt6OpenGL* PySide6/Qt/lib/libQt6WaylandClient* PySide6/Qt/lib/libQt6WlShellIntegration* PySide6/Qt/lib/libQt6EglFSDeviceIntegration* PySide6/Qt/lib/libQt6EglFsKmsSupport* PySide6/Qt/lib/libcrypto* PySide6/Qt/lib/libssl*
          rm -f PySide6/Qt/plugins/platforms/libqwayland* PySide6/Qt/plugins/platforms/libqeglfs* PySide6/Qt/plugins/platforms/libqlinuxfb* PySide6/Qt/plugins/platforms/libqvnc* PySide6/Qt/plugins/platforms/libqminimal* PySide6/Qt/plugins/platforms/libqminimalegl* PySide6/Qt/plugins/platforms/libqvkkhrdisplay*
          find PySide6/Qt/plugins/imageformats -type f ! -name "*qico*" -delete
          rm -f PySide6/Qt/plugins/platformthemes/libqgtk3.so
          rm -f libgtk-3* libgdk-3* libgdk_pixbuf* libpango* libatk* libcairo* libpixman* libgobject* libgio*
          rm -f PIL/_avif* pillow.libs/libavif* libavif* libgssapi_krb5* libkrb5* libk5crypto* libcom_err* libkeyutils*
          for f in PySide6/Qt/lib/*.so*; do b=$(basename "$f"); if [ -L "$b" ]; then rm -f "$b"; fi; done
          rm -f libxkbcommon* PySide6/Qt/lib/libxkbcommon* libX11* libXau* libXdmcp* libxcb* PySide6/Qt/lib/libX11* PySide6/Qt/lib/libxcb.so.*
          if find . -maxdepth 1 \( -name 'libxkbcommon*' -o -name 'libX11*' -o -name 'libXau*' -o -name 'libXdmcp*' -o -name 'libxcb*' \) | grep -q .; then
            echo "::error::bundled X11 stack found: these libraries must come from the user's system"
            exit 1
          fi
          if find PySide6/Qt/lib -name 'libX11*' -o -name 'libxkbcommon*' -o -name 'libxcb.so.*' | grep -q .; then
            echo "::error::bundled core X11 libraries found in PySide6/Qt/lib"
            exit 1
          fi

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Cache smoke test apt packages
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: /var/cache/apt/archives
          key: linux-smoke-apt-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Headless smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 x11-utils xvfb xdotool openbox
          cd dist/MetalSlugFontReborn
          printf '%s\n' 'theme = "Light"' 'skip_location_prompt = true' 'skip_theme_prompt = true' > config.toml
          ulimit -c unlimited
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 openbox &
          OPENBOX_PID=$!
          sleep 2
          DISPLAY=:99 QT_LOGGING_RULES="*.debug=true" PYTHONFAULTHANDLER=1 ./MetalSlugFontReborn > smoke-app.log 2>&1 &
          APP_PID=$!
          sleep 12

          collect_diagnostics() {
            echo "===== APP OUTPUT (QT_LOGGING_RULES=*.debug=true, PYTHONFAULTHANDLER=1) ====="
            echo "--- error-ish lines ---"
            grep -anE "cannot load|Could not|error|Error|ERROR|Fatal|fault|Traceback|not found|Aborted" smoke-app.log | head -50 || true
            echo "--- first 120 lines ---"
            head -120 smoke-app.log || true
            echo "===== SYSTEM CONTEXT ====="
            uname -a
            head -2 /etc/os-release
            echo "--- missing shared object deps ---"
            ldd MetalSlugFontReborn 2>&1 | grep -i "not found" || echo "none missing"
            echo "--- relevant env ---"
            env | grep -E "^(QT_|DISPLAY|XDG)" || true
            echo "===== CORE DUMP ====="
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
            CORE=$(ls -t core* 2>/dev/null | head -1 || true)
            if [ -z "$CORE" ] && command -v coredumpctl >/dev/null; then
              coredumpctl list --no-pager 2>/dev/null | tail -5 || true
              if coredumpctl dump --output=smoke-core MetalSlugFontReborn 2>/dev/null; then
                CORE=smoke-core
              fi
            fi
            if [ -n "$CORE" ]; then
              sudo apt-get install -y gdb >/dev/null 2>&1
              gdb -q -batch -ex "thread apply all bt" ./MetalSlugFontReborn "$CORE" 2>&1 | tail -150 || true
            else
              echo "no core dump available; see APP OUTPUT above"
            fi
          }

          WID=""
          for wid in $(DISPLAY=:99 xdotool search --name "MetalSlugFontReborn" 2>/dev/null); do
            if DISPLAY=:99 xwininfo -id "$wid" 2>/dev/null | grep -q "Map State: IsViewable"; then
              WID="$wid"
              break
            fi
          done
          if [ -z "$WID" ]; then
            collect_diagnostics
            echo "===== WINDOW TREE ====="
            DISPLAY=:99 xwininfo -root -tree 2>&1 | head -40 || true
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "app process is ALIVE but no viewable window matched the searches"
            else
              echo "app process is DEAD"
            fi
            echo "::error::app window not found; see diagnostics above"
            exit 1
          fi
          DISPLAY=:99 xdotool windowactivate --sync "$WID" 2>/dev/null || DISPLAY=:99 xdotool windowfocus "$WID" 2>/dev/null || true
          sleep 1
          DISPLAY=:99 xdotool type --delay 120 "HELLO"
          sleep 2
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            collect_diagnostics
            echo "::error::app crashed while typing"
            exit 1
          fi
          TITLE=$(DISPLAY=:99 xdotool getwindowname "$WID" 2>/dev/null || echo "")
          if ! echo "$TITLE" | grep -q "5 characters"; then
            collect_diagnostics
            echo "window title after typing: $TITLE"
            echo "::error::keystrokes did not reach the app (title does not count 5 characters)"
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          kill "$OPENBOX_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          rm -f config.toml smoke-app.log core smoke-core
          echo "smoke test passed: window focused, HELLO typed, title counts 5 characters, process alive"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-Linux-x64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python
        run: uv python install 3.15

      - name: Restore uv cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/Library/Caches/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --strip --name "MetalSlugFontReborn" --clean --optimize "2" --add-data "Src/build_commit.txt:." --add-data "LICENSE:." --add-data "Assets:Assets/" --add-binary "rust/rotsprite-rs/target/release/libmsfr_rotsprite.dylib:."  "Src/main.py"

      - name: Trim unused Qt components
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines PySide6/plugins/imageformats setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* PySide6/Qt6OpenGL* PySide6/Qt6DBus* PySide6/Qt6Qml* PySide6/Qt6Quick* PySide6/Qt6Pdf* PySide6/Qt6Test* PySide6/Qt6Sql* PySide6/Qt6Help* PySide6/Qt6Designer* PySide6/Qt6UiTools* PySide6/Qt6Xml* PySide6/Qt6Concurrent* PySide6/Qt6PrintSupport* PySide6/libQt6Network* PySide6/libQt6Svg* PySide6/libQt6OpenGL* PySide6/libQt6DBus* libcrypto* libssl*
          rm -rf PySide6/Qt/translations PySide6/Qt/plugins/tls PySide6/Qt/plugins/networkinformation PySide6/Qt/plugins/generic PySide6/Qt/plugins/iconengines
          rm -f PySide6/Qt/lib/libQt6Network* PySide6/Qt/lib/libQt6Svg* PySide6/Qt/lib/libQt6OpenGL* PySide6/Qt/lib/libQt6DBus* PySide6/Qt/lib/libcrypto* PySide6/Qt/lib/libssl*
          find PySide6/plugins/imageformats PySide6/Qt/plugins/imageformats -type f ! -name "*qico*" -delete 2>/dev/null || true
          rm -f PIL/_avif* libavif*
          rm -rf PySide6/Qt/lib/QtNetwork.framework PySide6/Qt/lib/QtSvg.framework PySide6/Qt/lib/QtDBus.framework

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-macOS-ARM64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  profiler:
    name: Profiler
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Install Python
        run: uv python install 3.15

      - name: Create virtual environment
        run: uv venv --python 3.15

      - name: Restore uv cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install pyinstaller pillow

      - name: Put the virtual environment on PATH
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build the profiler
        run: |
          pyinstaller --noconfirm --onedir --console --clean --icon "Assets/Icons/Raubtier.ico" --name "MSFRProfiler" --paths Src --add-data "Assets;Assets/" Tools/sample_profiler.py

      - name: Move Assets
        run: |
          mv dist/MSFRProfiler/_internal/Assets dist/MSFRProfiler/

      - name: Smoke test the profiler
        shell: bash
        run: |
          output=$(./dist/MSFRProfiler/MSFRProfiler.exe 2>&1 | head -1)
          echo "$output"
          case "$output" in
            *"supported font 1 characters"*) echo "profiler runs" ;;
            *) exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MSFRProfiler-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist/MSFRProfiler
          compression-level: 9
