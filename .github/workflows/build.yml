name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - Development
    paths:
      - '.github/workflows/**'
      - 'Assets/**'
      - 'Src/**'
      - 'Tools/**'
      - 'rust/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'versionfile.txt'

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Install Python
        run: uv python install 3.14.8

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        shell: bash
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "Assets/Icons/Raubtier.ico" --name "MetalSlugFontReborn" --clean --optimize "2" --version-file "versionfile.txt" --add-data "Src/build_commit.txt;." --add-data "LICENSE;." --add-data "Assets;Assets/" --add-binary "rust/rotsprite-rs/target/release/msfr_rotsprite.dll;."  "Src/main.py"

      - name: Trim unused Qt components
        shell: bash
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* libcrypto-3-x64.dll libssl-3-x64.dll

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python
        run: uv python install 3.14.8

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --strip --name "MetalSlugFontReborn" --clean --optimize "2" --add-data "Src/build_commit.txt:." --add-data "LICENSE:." --add-data "Assets:Assets/" --add-binary "rust/rotsprite-rs/target/release/libmsfr_rotsprite.so:."  "Src/main.py"

      - name: Trim unused Qt components
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* PySide6/libQt6Network* PySide6/libQt6Svg* libcrypto* libssl*
          rm -rf PySide6/Qt/translations PySide6/Qt/plugins/tls PySide6/Qt/plugins/networkinformation PySide6/Qt/plugins/generic PySide6/Qt/plugins/iconengines
          rm -f PySide6/Qt/lib/libQt6Network* PySide6/Qt/lib/libQt6Svg* PySide6/Qt/lib/libcrypto* PySide6/Qt/lib/libssl*

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-Linux-x64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  build-macos:
    name: macOS
    runs-on: macOS-15-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python
        run: uv python install 3.14.8

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Put the virtual environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Write build commit
        run: git rev-parse --short HEAD > Src/build_commit.txt

      - name: Build rotation library
        run: |
          rustup update stable
          cargo build --release --manifest-path rust/rotsprite-rs/Cargo.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --strip --name "MetalSlugFontReborn" --clean --optimize "2" --add-data "Src/build_commit.txt:." --add-data "LICENSE:." --add-data "Assets:Assets/" --add-binary "rust/rotsprite-rs/target/release/libmsfr_rotsprite.dylib:."  "Src/main.py"

      - name: Trim unused Qt components
        run: |
          cd dist/MetalSlugFontReborn/_internal
          rm -rf PySide6/translations PySide6/plugins/tls PySide6/plugins/networkinformation PySide6/plugins/generic PySide6/plugins/iconengines setuptools
          rm -f PySide6/opengl32sw.dll PySide6/Qt6Network* PySide6/Qt6Svg* PySide6/libQt6Network* PySide6/libQt6Svg* libcrypto* libssl*
          rm -rf PySide6/Qt/translations PySide6/Qt/plugins/tls PySide6/Qt/plugins/networkinformation PySide6/Qt/plugins/generic PySide6/Qt/plugins/iconengines
          rm -f PySide6/Qt/lib/libQt6Network* PySide6/Qt/lib/libQt6Svg* PySide6/Qt/lib/libcrypto* PySide6/Qt/lib/libssl*

      - name: Move Assets
        run: |
          mv dist/MetalSlugFontReborn/_internal/Assets dist/MetalSlugFontReborn/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MetalSlugFontReborn-${{ steps.sha.outputs.short_sha }}-macOS-ARM64
          path: dist/MetalSlugFontReborn
          compression-level: 9

  profiler:
    name: Profiler
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Install Python
        run: uv python install 3.14.8

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install pyinstaller pillow

      - name: Put the virtual environment on PATH
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build the profiler
        run: |
          pyinstaller --noconfirm --onedir --console --clean --icon "Assets/Icons/Raubtier.ico" --name "MSFRProfiler" --paths Src --add-data "Assets;Assets/" Tools/sample_profiler.py

      - name: Move Assets
        run: |
          mv dist/MSFRProfiler/_internal/Assets dist/MSFRProfiler/

      - name: Smoke test the profiler
        shell: bash
        run: |
          output=$(./dist/MSFRProfiler/MSFRProfiler.exe 2>&1 | head -1)
          echo "$output"
          case "$output" in
            *"supported font 1 characters"*) echo "profiler runs" ;;
            *) exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MSFRProfiler-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist/MSFRProfiler
          compression-level: 9
